<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d8c">
  <title>Восьмой Бланк</title>
  <meta name="description" content="Мини-приложение агентства «Восьмой Бланк» для мессенджера MAX: услуги, маркетинг для детских центров и школ, заявка на консультацию.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- MAX Bridge: даёт window.WebApp внутри мессенджера. В обычном браузере приложение работает без него. -->
  <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#home" data-nav="home">
        <span class="brand__mark" aria-hidden="true">8</span>
        <span class="brand__name">Восьмой Бланк</span>
      </a>
      <button class="topbar__cta" type="button" data-nav="lead">Заявка</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-nav="home" class="tabbar__item is-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Главная</span>
      </button>
      <button type="button" data-nav="services" class="tabbar__item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zm0 6h16v4H4zm0 6h10v2H4z"/></svg>
        <span>Услуги</span>
      </button>
      <button type="button" data-nav="marketing" class="tabbar__item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-4h4l7-5v14l-7-5zm12-5.5a4 4 0 0 1 0 7"/></svg>
        <span>Маркетинг</span>
      </button>
      <button type="button" data-nav="lead" class="tabbar__item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H7l-3 3zm4 4h8v2H8zm0 4h5v2H8z"/></svg>
        <span>Заявка</span>
      </button>
    </nav>
  </div>

  <script src="content.js"></script>
  <script src="max-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
